---
deployment:
  tasks:
    - /bin/npm install
    - /bin/npm run build
    - /bin/rm -rf /home1/elternit/public_html/pet/*
    - /bin/cp -R dist/* /home1/elternit/public_html/pet/
    - /bin/find /home1/elternit/public_html/pet/ -type d -exec chmod 755 {} \;
    - /bin/find /home1/elternit/public_html/pet/ -type f -exec chmod 644 {} \;